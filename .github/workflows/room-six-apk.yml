name: Kavian 0.5.8 build and verification
on: push
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Logic and receipt checks
        run: |
          npm test
          node --test tests/playtest-058.test.cjs
          mkdir -p .local/receipt-tests
          javac -d .local/receipt-tests src/android/ReceiptSignature.java tests/ReceiptSignatureTest.java
          java -cp .local/receipt-tests ReceiptSignatureTest
      - name: Build both complete APK variants
        run: |
          python tools/setup_android.py
          python tools/build_android.py
          KAVIAN_REVIEW=1 python tools/build_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: Kavian-0.5.8-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Install browser for automated regression
        run: npx playwright install --with-deps chromium
      - name: Play both opening branches through the report
        run: node tests/room-six-guided-ui.cjs
