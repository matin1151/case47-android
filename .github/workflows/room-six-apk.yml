name: Room Six Android review
on: push
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify signed offline review APK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          toolroot="$RUNNER_TEMP/kavian-sdk"
          mkdir -p "$toolroot/build-tools" "$toolroot/platform"
          ln -s "$ANDROID_HOME/build-tools/35.0.0" "$toolroot/build-tools/android-15"
          ln -s "$ANDROID_HOME/platforms/android-35" "$toolroot/platform/android-35"
          sed -i 's/package="com.bidrano.kavian"/package="com.bidrano.kavian.review"/;s/versionName="0.5.3"/versionName="0.5.7"/;s/versionCode="8"/versionCode="12"/;s/android:name=".MainActivity"/android:name="com.bidrano.kavian.MainActivity"/;s/android:label="کاویان"/android:label="کاویان آزمایشی"/' src/android/AndroidManifest.xml
          touch "$toolroot/ecj.jar"
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/build_android.py')
          s = p.read_text()
          s = s.replace("run('java','-jar',ECJ,'-1.8','-proc:none','-nowarn'", "run('javac','-source','8','-target','8','-encoding','UTF-8','-proc:none','-nowarn'")
          p.write_text(s)
          PY
          npm test
          CASE47_ANDROID_TOOLS="$toolroot" python tools/build_android.py
          mv dist/Case47-0.5.3-test.apk dist/Kavian-Room-Six-0.5.7-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Kavian-Room-Six-0.5.7-test.apk | head -10
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          with zipfile.ZipFile('dist/Kavian-Room-Six-0.5.7-test.apk') as apk:
              assert apk.testzip() is None
              assert 'classes.dex' in apk.namelist()
              for name in ('index.html', 'cases.bundle.js', 'room-six-journey.js', 'cases/room-six.json'):
                  assert apk.read('assets/www/' + name) == (Path('web') / name).read_bytes()
              assert b'"buildVersion": "0.5.7"' in apk.read('assets/www/cases.bundle.js')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Kavian-Room-Six-0.5.7-test
          path: dist/Kavian-Room-Six-0.5.7-test.apk
          if-no-files-found: error
          retention-days: 30
