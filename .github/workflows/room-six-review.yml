name: Room Six review HTML
on:
  push:
    branches: [codex/room-six]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node tools/build_web.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Kavian-Room-Six-review-0.5.5
          path: dist/Kavian-Room-Six-0.5.5.html
          retention-days: 30
