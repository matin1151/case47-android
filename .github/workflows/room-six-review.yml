name: Room Six review HTML
on:
  push:
    branches: [codex/room-six]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node tools/build_web.cjs
      - id: version
        run: echo "value=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Kavian-Room-Six-review-${{ steps.version.outputs.value }}
          path: dist/Kavian-Room-Six-${{ steps.version.outputs.value }}.html
          retention-days: 30
